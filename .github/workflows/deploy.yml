# Deploy on geeks-v* tags: build image -> push to GHCR -> scp compose to Poppy over
# Tailscale -> pull & up. Tag prefix is geeks-v because upstream owns v1.0-v2.7.
# Repo secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET, UNRAID_SSH_KEY,
#   UNRAID_HOST, UNRAID_USER, UNRAID_DEPLOY_PATH.  Repo var: TS_TAGS.
name: Deploy
on:
  push:
    tags: ["geeks-v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/oneofthegeeks/goatcounter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:github-actions' }}
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.UNRAID_SSH_KEY }}
      - name: Copy compose to Poppy
        env:
          UNRAID_USER: ${{ secrets.UNRAID_USER }}
          UNRAID_HOST: ${{ secrets.UNRAID_HOST }}
          UNRAID_DEPLOY_PATH: ${{ secrets.UNRAID_DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$UNRAID_USER@$UNRAID_HOST" \
            "mkdir -p \"$UNRAID_DEPLOY_PATH\""
          scp -o StrictHostKeyChecking=accept-new docker-compose.yml \
            "$UNRAID_USER@$UNRAID_HOST:$UNRAID_DEPLOY_PATH/docker-compose.yml"
      - name: Pull & deploy
        env:
          UNRAID_USER: ${{ secrets.UNRAID_USER }}
          UNRAID_HOST: ${{ secrets.UNRAID_HOST }}
          UNRAID_DEPLOY_PATH: ${{ secrets.UNRAID_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          # Values that the REMOTE shell needs are passed as VAR=value assignments on
          # the ssh command line, each shell-quoted with printf %q on the runner side —
          # not interpolated into the heredoc — so no value can break out and run as
          # code on either side, no matter what a tag/actor name contains.
          REMOTE_ENV=$(printf 'IMAGE_TAG=%q GHCR_ACTOR=%q GHCR_TOKEN=%q UNRAID_DEPLOY_PATH=%q' \
            "$IMAGE_TAG" "$GHCR_ACTOR" "$GHCR_TOKEN" "$UNRAID_DEPLOY_PATH")
          ssh -o StrictHostKeyChecking=accept-new "$UNRAID_USER@$UNRAID_HOST" \
            "$REMOTE_ENV bash -s" <<'EOF'
            set -e
            cd "$UNRAID_DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
          EOF
